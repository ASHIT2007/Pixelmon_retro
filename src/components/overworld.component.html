<div class="w-full h-full relative bg-[#000000] overflow-hidden select-none">
  
  <!-- Camera Viewport - The world translates inside this -->
  <div class="absolute inset-0 transition-transform duration-200 ease-linear will-change-transform"
       [style.transform]="'translate(' + cameraOffsetX() + 'px, ' + cameraOffsetY() + 'px)'"
       [style.width.px]="mapLayout[0].length * tileSize"
       [style.height.px]="mapLayout.length * tileSize">
    
    <!-- Render Map Tiles -->
    @for (row of mapLayout; track rIdx; let rIdx = $index) {
      @for (cell of row; track cIdx; let cIdx = $index) {
        <div class="absolute"
             [class]="'tile tile-' + cell + ' ' + getTileFallbackClass(cell)"
             [style.left.px]="cIdx * tileSize"
             [style.top.px]="rIdx * tileSize"
             [style.width.px]="tileSize"
             [style.height.px]="tileSize">
        </div>
      }
    }

    <!-- Player Character Sprite -->
    <div class="absolute z-20 transition-all duration-200 ease-linear flex items-end justify-center pb-1"
         [style.left.px]="game.playerPos().x * tileSize"
         [style.top.px]="game.playerPos().y * tileSize - (tileSize * 0.2)" 
         [style.width.px]="tileSize"
         [style.height.px]="tileSize * 1.2"> <!-- Taller than tile to overlap -->
      
      <!-- CSS representation of GBA-style "Red" character -->
      <div class="player-sprite">
        <div class="head">
          <div class="hat"></div>
          <div class="brim"></div>
          <div class="face"></div>
        </div>
        <div class="body">
          <div class="backpack"></div>
          <div class="shirt"></div>
          <div class="pants"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Virtual Gamepad Overlay (GBA Style) -->
  <div class="absolute inset-0 pointer-events-none z-50">
    
    <!-- D-Pad -->
    <div class="absolute bottom-6 left-6 pointer-events-auto">
      <div class="relative w-32 h-32 opacity-40 hover:opacity-60 transition-opacity">
        <!-- D-Pad Base Cross -->
        <div class="absolute top-1/3 left-0 w-full h-1/3 bg-black rounded-lg"></div>
        <div class="absolute left-1/3 top-0 w-1/3 h-full bg-black rounded-lg"></div>
        
        <!-- Invisible Touch Targets for D-Pad -->
        <div class="absolute top-0 left-1/3 w-1/3 h-1/3 active:bg-white/20 rounded-t-lg" (pointerdown)="move(0, -1)"></div>
        <div class="absolute bottom-0 left-1/3 w-1/3 h-1/3 active:bg-white/20 rounded-b-lg" (pointerdown)="move(0, 1)"></div>
        <div class="absolute left-0 top-1/3 w-1/3 h-1/3 active:bg-white/20 rounded-l-lg" (pointerdown)="move(-1, 0)"></div>
        <div class="absolute right-0 top-1/3 w-1/3 h-1/3 active:bg-white/20 rounded-r-lg" (pointerdown)="move(1, 0)"></div>
        <!-- Center pivot detail -->
        <div class="absolute top-1/2 left-1/2 w-4 h-4 bg-gray-700 rounded-full -translate-x-1/2 -translate-y-1/2 shadow-inner"></div>
      </div>
    </div>

    <!-- Action Buttons (A / B) -->
    <div class="absolute bottom-8 right-8 flex gap-4 pointer-events-auto">
      <button (pointerdown)="actionB()" 
              class="w-14 h-14 rounded-full bg-black/40 text-white/70 font-bold border-2 border-black/50 shadow-[0_4px_0_rgba(0,0,0,0.5)] active:translate-y-1 active:shadow-none hover:bg-black/50 transition-all flex items-center justify-center pt-1">
        B
      </button>
      <button (pointerdown)="actionA()" 
              class="w-14 h-14 rounded-full bg-black/40 text-white/70 font-bold border-2 border-black/50 shadow-[0_4px_0_rgba(0,0,0,0.5)] active:translate-y-1 active:shadow-none hover:bg-black/50 transition-all flex items-center justify-center pt-1 -translate-y-6">
        A
      </button>
    </div>

    <!-- Start / Select (Top Menus) -->
    <div class="absolute top-4 right-4 flex gap-2 pointer-events-auto opacity-70">
      <button (click)="openTeam()" class="bg-black/50 text-white text-[8px] px-3 py-1 rounded-full border border-white/30 backdrop-blur-sm active:bg-black/80">TEAM</button>
      <button (click)="actionB()" class="bg-black/50 text-white text-[8px] px-3 py-1 rounded-full border border-white/30 backdrop-blur-sm active:bg-black/80">HEAL</button>
    </div>
  </div>

  <!-- Overlay Messages -->
  @if (game.messages().length > 0) {
    <div class="absolute bottom-32 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] bg-white border-4 border-[#1a202c] p-3 rounded-lg shadow-xl pointer-events-none z-[60]">
      @for (msg of game.messages(); track $index) {
        <p class="mb-1 text-sm md:text-base leading-relaxed">{{ msg }}</p>
      }
      <!-- Little blinking arrow indicator -->
      <div class="absolute bottom-2 right-3 animate-pulse text-xs">▼</div>
    </div>
  }

</div>
