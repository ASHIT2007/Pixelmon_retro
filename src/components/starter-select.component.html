<div class="w-full h-full bg-[#f8f8f8] flex flex-col items-center justify-center p-6 relative">
  
  <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;"></div>

  <div class="battle-menu-box p-6 z-10 w-full text-center mb-8">
    <h1 class="text-lg md:text-xl mb-4 leading-relaxed">Prof. Oak: <br>Choose your first<br>POKEMON!</h1>
    <p class="text-[10px] text-gray-500">Tap a Pokeball to select.</p>
  </div>

  <div class="flex gap-4 sm:gap-8 z-10 w-full justify-center">
    @for (starter of starters; track starter.id) {
      <button (click)="choose(starter.id)" 
              class="group flex flex-col items-center focus:outline-none transition-transform hover:-translate-y-2">
        
        <!-- Pokeball Icon -->
        <div class="w-16 h-16 rounded-full border-4 border-black bg-gradient-to-b from-red-500 from-50% to-white to-50% relative flex items-center justify-center shadow-lg mb-2">
          <div class="w-full h-1 bg-black absolute top-1/2 -translate-y-1/2"></div>
          <div class="w-4 h-4 bg-white border-4 border-black rounded-full absolute z-10"></div>
        </div>

        <!-- Sprite Reveal on Hover (Desktop) / Always slightly visible indicator -->
        <div class="battle-menu-box p-1 opacity-0 group-hover:opacity-100 transition-opacity absolute top-1/2 translate-y-10 pointer-events-none">
          <img [src]="getSprite(starter.id)" class="w-12 h-12 object-cover">
        </div>
        
        <span class="text-[10px] sm:text-xs mt-2 battle-menu-box px-2 py-1 bg-white">{{ starter.name }}</span>
      </button>
    }
  </div>

</div>
