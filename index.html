<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PixelMon Retro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Press Start 2P', system-ui, sans-serif;
      background-color: #2d3748; /* Tailwind gray-800 */
      color: #1a202c; /* Tailwind gray-900 */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation; /* Prevent zoom on double tap */
    }
    .game-container {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 4/3;
      background-color: #f8f9fa;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 4px solid #1a202c;
      image-rendering: pixelated;
    }
    
    /* Custom Scrollbar for menus */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* Battle UI specific styles to keep HTML cleaner */
    .battle-menu-box {
      border: 4px solid #1a202c;
      border-radius: 8px;
      background: white;
      box-shadow: inset 0 0 0 2px white, inset 0 0 0 4px #1a202c;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-blink { animation: blink 1s infinite; }
    
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
    .animate-shake { animation: shake 0.5s ease-in-out; }

    /* Battle Attack Projectile Animations */
    .anim-shoot-up { animation: shootUp 0.4s ease-in forwards; }
    .anim-shoot-down { animation: shootDown 0.4s ease-in forwards; }

    @keyframes shootUp {
      0% { transform: translate(-80px, 80px) scale(0.5); opacity: 0; }
      20% { opacity: 1; transform: translate(-60px, 60px) scale(1); }
      80% { transform: translate(60px, -60px) scale(1.5); opacity: 1; }
      100% { transform: translate(80px, -80px) scale(2); opacity: 0; }
    }

    @keyframes shootDown {
      0% { transform: translate(80px, -80px) scale(0.5); opacity: 0; }
      20% { opacity: 1; transform: translate(60px, -60px) scale(1); }
      80% { transform: translate(-60px, 60px) scale(1.5); opacity: 1; }
      100% { transform: translate(-80px, 80px) scale(2); opacity: 0; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://esm.sh/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://esm.sh/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://esm.sh/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://esm.sh/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://esm.sh/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://esm.sh/rxjs@^7.8.2/fetch?conditions=es2015",
    "@angular/core": "https://esm.sh/@angular/core@^21.1.5?external=rxjs",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@^21.1.5?external=rxjs",
    "@angular/compiler": "https://esm.sh/@angular/compiler@^21.1.5?external=rxjs"
  }
}
</script>
</head>
<body>
  <div class="game-container text-xs sm:text-sm">
    <app-root></app-root>
  </div>
</body>
</html>
